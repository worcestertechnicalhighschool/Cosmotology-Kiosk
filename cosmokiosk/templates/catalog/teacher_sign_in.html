{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Teacher Sign In</title>

    <!-- Connects this HTML page to teacher_sign_in.css -->
    <link rel="stylesheet" href="{% static 'css/teacher_sign_in.css' %}">
</head>

<body>

    <main class="teacher-page">

        <h1>Teacher Portal</h1>
        <p class="subtitle">Access the Cosmetology Teacher Dashboard</p>

        <div class="forms-container">
            <div class="form-bubble">
                {% if error_message %}
                    <p class="error-message">
                    {{ error_message }}
                    </p>
                {% endif %}

                <h2>Log In</h2>

                <p class="form-description">
                    Welcome Teachers, Sign in below!
                </p>

                <form method="POST">
                    {% csrf_token %}

                    <input type="hidden" name="form_type" value="sign_in">

                    <div class="input-group">
                        <label for="signin-email">Email</label>

                        <input
                            type="email"
                            id="signin-email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >
                    </div>


                    <div class="input-group">
                        <label for="signin-password">Password</label>

                        <input
                            type="password"
                            id="signin-password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >
                    </div>


                    <button type="submit" class="teacher-btn">
                        Log In
                    </button>

                </form>

            </div>
